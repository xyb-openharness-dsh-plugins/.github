name: 病种认领
description: 认领一个癌种或罕见病工作台（路径 A）
title: "[认领] <病种名>"
labels: ["claim", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先读 [BACKLOG.md](https://github.com/xyb-openharness-dsh-plugins/.github/blob/main/BACKLOG.md) 确认该病种尚未被认领，并读 [CONTRIBUTING-WORKBENCH.md](https://github.com/xyb-openharness-dsh-plugins/.github/blob/main/CONTRIBUTING-WORKBENCH.md)。
        **不确定能领什么？** 见 BACKLOG §4.1 三种投入方式——最低门槛是「内容 / 访谈认领」，不需要写代码，两小时的一次访谈也算贡献。
        **提交后在本 Issue 下评论 `/claim` 完成领取**（机器人会自动指派并打 `claimed` 标签，外部贡献者同样可用）。
        我们只做**信息整理与就诊准备**，不做诊断、不做治疗建议。
  - type: input
    id: disease
    attributes:
      label: 想认领的病种
      description: 若来自 NCCN 目录或《86 个罕见病病种诊疗指南（2025 年版）》，请写标准名称（可附目录编号）
      placeholder: 例如：肝细胞癌（NCCN）／肢端肥大症（罕见病 #3）
    validations:
      required: true
  - type: textarea
    id: relation
    attributes:
      label: 你与该病种的关联
      description: 患者本人 / 家属照护者 / 临床或研究专业 / 病友组织志愿者 / 开发者 / 其他。不需要提供任何可识别的个人信息。
    validations:
      required: true
  - type: textarea
    id: grading
    attributes:
      label: 分级判定卡（PROGRAM-PLAN §3）
      description: 逐项回答，不知道就写"无可靠数据"，不要猜。
      value: |
        1. 中国年新发/患病规模：高 / 中 / 低 / 无可靠数据
        2. 可触达的病友组织或真实患者叙述来源：
        3. 当前版本的中文诊疗规范（罕见病优先《86 个罕见病病种诊疗指南（2025 年版）》）：
        4. 随访资料是否天然结构化（周期性化验/影像/评分量表）：
        5. 与该家族已有样板的差异点（≥3 条）：
        6. 可投入的时间与合作方式：
    validations:
      required: true
  - type: textarea
    id: diff
    attributes:
      label: 差异化矩阵草案（防换名复用，至少 3 条）
      description: 每条写清「场景 → 功能 → 怎么验收」。写不出来说明还没到开工的时候，可以先开"需求讨论"类 Issue。
      placeholder: |
        1. 场景：… → 功能：… → 验收：…
        2. …
        3. …
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: 投入方式（BACKLOG §4.1）
      description: 选最贴近你实际情况的一档；随时可以升级，不能降级到"只围观"。
      options:
        - ① 整仓认领（T0/T1）：走完 G1→G2→G3→实现→V1/V2/V3，需要长期投入或小团队
        - ② 模块认领（T2/T3 挂靠）：做一个差异化模块或分型包，单人可完成，不建仓
        - ③ 内容 / 访谈认领：场景访谈、就诊问题清单、术语表、医学核对，不需要写代码
    validations:
      required: true
  - type: checkboxes
    id: roles
    attributes:
      label: 我能提供的角色（可多选，对应 BACKLOG「招募对象」列）
      options:
        - label: "👤 患者 / 家属：真实经历与场景排序"
        - label: "👨‍👩‍👧 患儿家长（儿童与遗传线的代记主体）"
        - label: "🩺 临床 / 科研 / 药学 / 护理：医学内容核对与红线把关"
        - label: "💻 开发：差异化模块实现"
        - label: "📝 内容 / 医学写作：资料整理、问题清单、术语表"
        - label: "🤝 病友组织 / 社群运营：需求征集、用户测试、分发"
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: 为什么这个病种现在需要（可选，但会加快分级）
      description: 从三个维度各写一句就够：① 帮扶人群规模（十万级/万级/千级/罕见）② 信息差（患者拿到的信息与实际决策复杂度落差）③ 危重与时间压力（生存期越短、决策窗越窄，信息整理的需求越迫切）。不确定就写"无可靠数据"，不要猜。
    validations:
      required: false
  - type: checkboxes
    id: redline
    attributes:
      label: 四条不可让步
      options:
        - label: 不做诊断与处置建议，不写"建议治疗/可能复发/可以停药/无需就医/治愈率"
          required: true
        - label: 患者数据本机优先，不引入静默上传
          required: true
        - label: 医学内容标注来源与版本，未核实项写「未核实」，不用相邻疾病外推
          required: true
        - label: 不复制指南临床内容，只引用病种名称与版本号作为范围参照
          required: true
